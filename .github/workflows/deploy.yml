name: Build and publish portfolio

on:
  push:
    branches: [master]
    paths:
      - 'source/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-portfolio
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build
        working-directory: source
        run: npm run build

      - name: Publish build to site root
        run: |
          rm -rf assets
          cp -R source/dist/. .
          rm -rf source/dist

      - name: Commit updated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet --cached || git commit -m 'Rebuild portfolio [skip ci]'
          git push
